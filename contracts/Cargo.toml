[package]
name = "fomo3d-masm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fomo3d-masm-build"
path = "src/main.rs"

[dependencies]
anyhow = "1"
miden-standards = { version = "=0.17.1", features = ["testing"] }
miden-protocol = "=0.17.1"
miden-client = { version = "=0.17.4", features = ["tonic"] }
miden-client-sqlite-store = "=0.17.3"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "query"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"




[dev-dependencies]
miden-testing = "=0.17.1"
